<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="initial-scale=1,user-scalable=no,maximum-scale=1,width=device-width">
<title>Postos de Trabalho no Setor Privado · Bragança Paulista</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&family=Raleway:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400&display=swap">
<link rel="stylesheet" href="css/leaflet.css">
<script src="js/jspdf.umd.min.js"></script>
<script src="js/leaflet.js"></script>
<style>
*,*::before,*::after{box-sizing:border-box;}
:root{--blue:#0175bc;--accent:#FFEF00;--bg:#0d1b2a;--panel:#0f2236;--panel2:#132b42;
  --card:#1a3550;--border:rgba(255,255,255,.10);--text:#e8eaf0;--muted:#7a9ab5;
  --header-h:52px;--sw:300px;--rw:286px;}
html,body{margin:0;height:100%;overflow:hidden;font-family:'Raleway',sans-serif;background:var(--bg);color:var(--text);}
#map{position:fixed!important;top:var(--header-h)!important;left:0;right:0;bottom:0;width:auto!important;height:auto!important;background:var(--bg);}
.leaflet-top,.leaflet-bottom{display:none!important;}

#pd-header{position:fixed;top:0;left:0;right:0;height:var(--header-h);background:var(--blue);
  border-bottom:3px solid var(--accent);display:flex;align-items:center;padding:0 16px;z-index:9000;gap:12px;}
#pd-header .logo-dot{width:8px;height:8px;background:var(--accent);border-radius:50%;box-shadow:0 0 10px var(--accent);flex-shrink:0;}
#pd-header h1{font-family:'Outfit',sans-serif;font-weight:700;font-size:14px;color:#fff;text-transform:uppercase;
  letter-spacing:.04em;white-space:nowrap;margin:0;}
#pd-header h1 span{color:var(--accent);}
#pd-header .sub{font-size:11px;color:rgba(255,255,255,.65);font-weight:300;white-space:nowrap;margin:0;}
#pd-header .sep{flex:1;}
.hbadge{font-family:'Outfit',sans-serif;font-size:10px;font-weight:700;color:var(--accent);
  border:1px solid rgba(255,239,0,.4);padding:3px 8px;border-radius:4px;white-space:nowrap;}
#pd-back{background:rgba(255,239,0,.08);border:1px solid rgba(255,239,0,.25);color:rgba(255,255,255,.8);
  font-size:12px;padding:6px 10px;border-radius:6px;text-decoration:none;}
#pd-back:hover{color:var(--accent);}
#pd-export,#pd-panel,#pd-legenda{background:rgba(255,239,0,.1);border:1px solid rgba(255,239,0,.4);color:var(--accent);
  font-family:'Raleway',sans-serif;font-size:12px;font-weight:500;padding:6px 12px;border-radius:6px;cursor:pointer;}
#pd-export:hover,#pd-panel:hover,#pd-legenda:hover{background:rgba(255,239,0,.18);}

/* painéis */
.pane{position:fixed;top:var(--header-h);height:calc(100vh - var(--header-h));background:var(--panel);
  z-index:8000;display:flex;flex-direction:column;transition:transform .25s;overflow:hidden;}
#sb{left:0;width:var(--sw);border-right:1px solid var(--border);}
#sb.hidden{transform:translateX(-100%);}
#rb{right:0;width:var(--rw);border-left:1px solid var(--border);}
#rb.hidden{transform:translateX(100%);}
.pane-h{padding:12px 15px 9px;border-bottom:1px solid var(--border);flex-shrink:0;
  display:flex;align-items:center;justify-content:space-between;}
.pane-h span{font-family:'Outfit',sans-serif;font-size:11px;font-weight:700;color:var(--accent);
  letter-spacing:.07em;text-transform:uppercase;}
.pane-b{flex:1;overflow-y:auto;min-height:0;}
.pane-b::-webkit-scrollbar{width:4px;}
.pane-b::-webkit-scrollbar-thumb{background:rgba(255,255,255,.15);border-radius:2px;}
.panel-section{border-bottom:1px solid var(--border);padding-bottom:11px;}
.section-label{font-family:'Outfit',sans-serif;font-size:10px;font-weight:700;color:var(--muted);
  letter-spacing:.08em;text-transform:uppercase;padding:13px 15px 7px;display:block;}
.hint{font-size:10.5px;color:var(--muted);line-height:1.5;padding:5px 15px 0;font-style:italic;margin:0;}

.mode{display:flex;margin:0 15px;border-radius:8px;overflow:hidden;border:1px solid var(--border);}
.mode button{flex:1;background:var(--card);border:none;color:var(--muted);font-family:'Raleway',sans-serif;
  font-size:11.5px;font-weight:600;padding:9px 6px;cursor:pointer;transition:all .15s;line-height:1.25;}
.mode button small{display:block;font-size:9.5px;font-weight:400;opacity:.72;margin-top:2px;}
.mode button.on{background:rgba(255,239,0,.14);color:var(--accent);}
.selw{padding:8px 15px 0;}
.selw select{width:100%;background:var(--card);border:1px solid var(--border);color:var(--text);
  font-family:'Raleway',sans-serif;font-size:11.5px;padding:7px 9px;border-radius:6px;cursor:pointer;}
.anobx{padding:10px 15px 0;}
.anobx .top{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:5px;}
.anobx .top span{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;}
.anobx .top b{font-family:'Outfit',sans-serif;font-size:14px;font-weight:700;color:var(--accent);}
.anobx input{width:100%;accent-color:var(--accent);cursor:pointer;}
.anobx .tk{display:flex;justify-content:space-between;font-family:'Outfit',sans-serif;font-size:8.5px;color:var(--muted);margin-top:2px;}

.ltr{display:flex;align-items:center;gap:10px;padding:6px 15px;}
.ltr label:not(.tg){flex:1;font-size:12px;color:var(--text);cursor:pointer;}
.tg{position:relative;width:32px;height:18px;flex:0 0 32px;}
.tg input{opacity:0;width:0;height:0;position:absolute;}
.trk{position:absolute;inset:0;background:var(--card);border-radius:9px;cursor:pointer;
  transition:background .2s;border:1px solid var(--border);}
.trk::after{content:'';position:absolute;left:2px;top:2px;width:12px;height:12px;background:var(--muted);
  border-radius:50%;transition:all .2s;}
.tg input:checked + .trk{background:rgba(255,239,0,.15);border-color:var(--accent);}
.tg input:checked + .trk::after{background:var(--accent);left:16px;}
.fixo{font-size:9.5px;color:var(--muted);font-style:italic;white-space:nowrap;}
.opr{display:flex;align-items:center;gap:9px;padding:2px 15px 4px 30px;}
.opr label{font-size:10px;color:var(--muted);width:58px;flex-shrink:0;}
.opr input{flex:1;height:3px;accent-color:var(--accent);cursor:pointer;}
.opr span{font-size:10px;color:var(--muted);width:30px;text-align:right;}
.soR,.soM{display:none;}
body.escR .soR{display:block;} body.escM .soM{display:block;}
body.escR .ltr.soR,body.escM .ltr.soM{display:flex;}

.bmr{display:flex;gap:7px;padding:0 15px;}
.bmb{flex:1;background:var(--card);border:1px solid var(--border);color:var(--muted);
  font-size:11px;padding:6px 4px;border-radius:6px;cursor:pointer;text-align:center;font-family:'Raleway',sans-serif;}
.bmb.on{border-color:var(--accent);color:var(--accent);background:rgba(255,239,0,.08);}

/* legenda / ranking */
#lg{padding:12px 14px;}
.g{margin-bottom:15px;}
.gt{font-family:'Outfit',sans-serif;font-size:9.5px;font-weight:700;color:var(--muted);
  letter-spacing:.07em;text-transform:uppercase;margin-bottom:7px;}
.gts{display:block;font-family:'Raleway',sans-serif;font-weight:400;font-size:9.5px;
  color:var(--muted);text-transform:none;letter-spacing:0;margin-top:2px;}

/* Card de leitura dos pontos de Wi-Fi. Sem ponto sob o cursor mostra quantos
   moradores estão a até 500 m de ALGUM ponto; com o cursor sobre um ponto,
   mostra os daquele ponto. Os dois números nunca aparecem lado a lado, que era
   o que fazia a soma das linhas (6.498) não bater com o total (6.173): quem
   mora na faixa comum a dois pontos entra uma vez em cada linha e uma só no
   total. */
#leitura{padding:12px 14px 2px;}
.lc{background:rgba(34,211,238,.08);border-left:2px solid #22d3ee;border-radius:0 5px 5px 0;
  padding:10px 12px;min-height:176px;}
.lc.geral{background:rgba(255,239,0,.07);border-left-color:var(--accent);}
.lc.ubs{background:rgba(240,171,252,.09);border-left-color:#f0abfc;}
.lc.setor{background:rgba(255,255,255,.05);border-left-color:#93b4cc;}
.lc-k .pto{width:10px;height:10px;border-radius:50%;display:inline-block;flex-shrink:0;}
.lc-k{font-family:'Outfit',sans-serif;font-size:9px;font-weight:700;letter-spacing:.08em;
  text-transform:uppercase;color:var(--muted);margin-bottom:4px;display:flex;
  align-items:center;gap:6px;}
.lc-t{font-family:'Outfit',sans-serif;font-size:13px;font-weight:700;color:#fff;line-height:1.25;overflow-wrap:break-word;}
.lc-n{font-family:'Outfit',sans-serif;font-size:22px;font-weight:800;color:var(--text);
  line-height:1.1;margin-top:6px;font-variant-numeric:tabular-nums;}
.lc-u{font-size:10.5px;color:var(--text);margin-top:2px;line-height:1.45;}
.lc-e{font-size:10.5px;color:var(--text);margin-top:7px;line-height:1.5;
  border-top:1px solid rgba(255,255,255,.08);padding-top:6px;}
.lc-trava{font-size:9.5px;color:var(--muted);margin-top:7px;font-style:italic;}
.li.ck.sel{background:rgba(34,211,238,.14);}
.li{display:flex;align-items:center;gap:8px;margin-bottom:4px;padding:2px 4px;border-radius:4px;}
.li.ck{cursor:pointer;transition:opacity .15s;}
.li.ck:hover{background:rgba(255,255,255,.06);}
.li.off span{color:var(--muted);}
.li.off .sw{opacity:.3;filter:grayscale(1);}
.sw{width:17px;height:12px;border-radius:2px;flex-shrink:0;border:1px solid rgba(255,255,255,.15);}
.swc{border-radius:50%;flex-shrink:0;}
.swl{height:3px;border-radius:2px;flex-shrink:0;width:22px;}
.li span{font-size:11px;color:var(--text);line-height:1.3;flex:1;}
.li .cnt{font-size:9.5px;color:var(--muted);font-variant-numeric:tabular-nums;flex:0 0 auto;}
.note{font-size:10px;color:var(--muted);line-height:1.5;padding:4px 2px 0;font-style:italic;}
.callout{font-size:10px;color:var(--muted);line-height:1.5;background:rgba(255,239,0,.07);
  border-left:2px solid var(--accent);padding:9px 10px;border-radius:0 5px 5px 0;}
.callout b.t{color:var(--accent);}
.callout b{color:var(--text);}
.rk{display:grid;grid-template-columns:15px 96px 1fr 46px;align-items:center;column-gap:7px;padding:3.5px 5px;border-radius:4px;font-size:11px;cursor:pointer;}
.rk:hover{background:rgba(255,255,255,.07);}
.rk.bp{background:rgba(255,239,0,.08);}
.rk.bp .m{color:var(--accent);font-weight:600;}
.rk .n{width:15px;color:var(--muted);font-size:10px;text-align:right;flex-shrink:0;}
.rk .m{min-width:0;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.rk .p{font-weight:600;font-variant-numeric:tabular-nums;font-size:10.5px;color:var(--accent);text-align:right;white-space:nowrap;}
.rk .b{height:6px;background:rgba(255,255,255,.08);border-radius:3px;overflow:hidden;}
.rk .b i{display:block;height:100%;border-radius:3px;background:var(--accent);opacity:.8;}
.chips{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:10px;}
.chip{background:var(--card);border:1px solid var(--border);color:var(--muted);font-family:'Raleway',sans-serif;
  font-size:10.5px;padding:5px 8px;border-radius:14px;cursor:pointer;transition:all .15s;}
.chip:hover{color:var(--text);}
.chip.on{border-color:var(--accent);color:var(--accent);background:rgba(255,239,0,.08);}
.pos{font-family:'Outfit',sans-serif;font-size:10px;font-weight:700;color:var(--accent);white-space:nowrap;}
.bar-row{margin-bottom:7px;}
.leaflet-tooltip.sede{background:transparent;border:none;box-shadow:none;padding:0 0 0 2px;color:#fff;
  font-family:'Raleway',sans-serif;font-weight:600;white-space:nowrap;
  text-shadow:0 0 3px #0d1b2a,0 0 3px #0d1b2a,0 0 5px #0d1b2a;}
.leaflet-tooltip.sede::before{display:none;}
.leaflet-tooltip.sede.h1{font-size:12.5px;color:#FFEF00;font-weight:700;}
.leaflet-tooltip.sede.h2{font-size:11.5px;}
.leaflet-tooltip.sede.h3{font-size:10px;color:#d8e3ee;font-weight:500;}
body.base-clara .leaflet-tooltip.sede{color:#111;text-shadow:0 0 3px #fff,0 0 3px #fff,0 0 5px #fff;}
body.base-clara .leaflet-tooltip.sede.h1{color:#111;font-weight:800;}
body.base-clara .leaflet-tooltip.sede.h3{color:#222;}
.bar-lb{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin-bottom:3px;}
.bar-lb .n{font-size:10.5px;color:var(--text);line-height:1.25;}
.bar-lb .v{font-size:10.5px;font-weight:700;font-variant-numeric:tabular-nums;flex-shrink:0;color:var(--text);}
.bar-bg{height:5px;background:rgba(255,255,255,.07);border-radius:4px;overflow:hidden;}
.bar-fl{height:100%;border-radius:4px;}
.bar-sub{font-size:9.5px;color:var(--muted);margin-top:2px;}
.pt{width:100%;border-collapse:collapse;}
.pt th{text-align:left;padding:5px 8px 5px 0;font-size:10px;font-weight:600;text-transform:uppercase;
  color:var(--muted);border-bottom:1px solid rgba(255,255,255,.06);width:58%;word-break:break-word;}
.pt td{padding:5px 0 5px 8px;font-size:12px;color:var(--text);border-bottom:1px solid rgba(255,255,255,.06);
  text-align:right;font-variant-numeric:tabular-nums;}
.pt tr:last-child th,.pt tr:last-child td{border-bottom:none;}
/* cartão da área sob o cursor */
.sel-card{background:rgba(255,239,0,.07);border-left:2px solid var(--accent);
  border-radius:0 5px 5px 0;padding:9px 11px;margin-bottom:13px;}
.sel-n{font-family:'Outfit',sans-serif;font-size:12.5px;font-weight:700;color:#fff;line-height:1.2;margin-bottom:6px;}
.sel-g{display:grid;grid-template-columns:1fr 1fr;gap:5px 10px;}
.sel-f{display:flex;flex-direction:column;}
.sel-k{font-size:8.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;}
.sel-v{font-size:12.5px;font-weight:700;color:var(--accent);font-family:'Outfit',sans-serif;}
.sel-vazio{font-size:11px;color:var(--muted);font-style:italic;line-height:1.5;
  padding:9px 11px;border-left:2px solid var(--border);margin-bottom:13px;}

/* popups */
.leaflet-popup-content-wrapper{background:var(--panel2)!important;border:1px solid var(--border)!important;
  border-radius:10px!important;box-shadow:0 8px 32px rgba(0,0,0,.5)!important;width:330px!important;}
.leaflet-popup-tip{background:var(--panel2)!important;}
.leaflet-popup-content{color:var(--text)!important;font-family:'Raleway',sans-serif!important;font-size:12px!important;
  margin:0!important;padding:14px 16px!important;max-height:62vh!important;overflow-y:auto!important;overflow-x:hidden!important;}
.leaflet-popup-content::-webkit-scrollbar{width:4px;}
.leaflet-popup-content::-webkit-scrollbar-thumb{background:rgba(255,255,255,.15);border-radius:2px;}
.leaflet-popup-close-button{color:var(--muted)!important;}
.ph{font-family:'Outfit',sans-serif;font-size:15px;font-weight:700;color:#fff;margin-bottom:2px;line-height:1.15;}
.ps{font-size:10px;color:var(--accent);text-transform:uppercase;letter-spacing:.06em;font-weight:600;margin-bottom:10px;}
.pgrid{display:grid;grid-template-columns:1fr 1fr;gap:6px 12px;margin:4px 0 4px;}
.pf{display:flex;flex-direction:column;}
.pk{font-size:9px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;}
.pv{font-size:14px;font-weight:700;color:var(--accent);font-family:'Outfit',sans-serif;}
.chart{margin:10px 0 4px;}
.chart-t{font-size:9.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;
  color:var(--muted);margin-bottom:7px;display:flex;align-items:center;gap:6px;}
.chart-t::after{content:'';flex:1;height:1px;background:rgba(255,255,255,.09);}
.cols{display:flex;align-items:flex-end;gap:4px;height:74px;padding-top:4px;}
.cols .c{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;}
.cols .c i{display:block;width:100%;border-radius:2px 2px 0 0;min-height:1px;}
.cols .c b{font-size:8px;color:var(--muted);font-weight:500;margin-top:3px;font-family:'Outfit',sans-serif;}
.cols .c.on i{box-shadow:0 0 0 1.5px var(--accent);}
.tag{display:inline-block;font-size:10px;font-weight:600;padding:3px 8px;border-radius:4px;margin-top:9px;margin-right:4px;}
.pexp{font-size:11px;color:var(--muted);line-height:1.5;margin-top:9px;padding-top:9px;
  border-top:1px solid rgba(255,255,255,.08);}
.pexp b{color:var(--text);}
.pbtn{display:block;width:100%;margin-top:10px;background:rgba(255,239,0,.1);border:1px solid rgba(255,239,0,.4);
  color:var(--accent);font-family:'Raleway',sans-serif;font-size:11.5px;font-weight:600;padding:7px;border-radius:6px;cursor:pointer;}
.pbtn:hover{background:rgba(255,239,0,.18);}

#md{display:none;position:fixed;inset:0;background:rgba(0,0,0,.6);backdrop-filter:blur(4px);
  z-index:99000;align-items:center;justify-content:center;}
#md.open{display:flex;}
#mb{background:var(--panel2);border:1px solid var(--border);border-radius:14px;padding:26px 30px;width:340px;}
#mt{font-family:'Outfit',sans-serif;font-size:16px;font-weight:700;margin-bottom:8px;}
#mdesc{font-size:12px;color:var(--muted);margin:0 0 18px;}
#mbtn{display:flex;gap:10px;margin-bottom:14px;}
#mst{font-size:11px;color:var(--accent);min-height:16px;margin-bottom:10px;text-align:center;}
#mcl{width:100%;background:none;border:1px solid var(--border);border-radius:6px;color:var(--muted);
  font-size:12px;padding:8px;cursor:pointer;font-family:'Raleway',sans-serif;}
.eb{flex:1;background:var(--card);border:1px solid var(--border);border-radius:8px;color:var(--text);
  font-size:13px;padding:12px;cursor:pointer;font-family:'Raleway',sans-serif;}
.eb:hover{border-color:var(--accent);color:var(--accent);}

@media(max-width:1100px){#rb{display:none;}}

.dotc{width:10px;height:10px;border-radius:50%;flex-shrink:0;display:inline-block;}
.ltr .dotc{margin-right:-2px;}
.sub{padding-left:15px;}

.ind{display:flex;flex-direction:column;gap:5px;padding:0 15px;}
.ind button{background:var(--card);border:1px solid var(--border);color:var(--muted);text-align:left;font-family:'Raleway',sans-serif;
  font-size:11.5px;padding:7px 10px;border-radius:6px;cursor:pointer;line-height:1.3;}
.ind button small{display:block;font-size:9.5px;opacity:.75;}
.ind button.on{border-color:var(--accent);color:var(--accent);background:rgba(255,239,0,.08);}
.ind .sub{font-family:'Outfit',sans-serif;font-size:9px;font-weight:700;color:var(--muted);letter-spacing:.07em;text-transform:uppercase;margin:6px 0 1px;padding-left:0;}
.mini{display:flex;align-items:center;gap:6px;margin:3px 0;}
.mini .l{flex:0 0 112px;font-size:10.5px;color:var(--text);}
.mini .b{flex:1;height:6px;background:rgba(255,255,255,.08);border-radius:3px;overflow:hidden;}
.mini .b i{display:block;height:100%;border-radius:3px;}
.mini .v{flex:0 0 42px;text-align:right;font-size:10.5px;font-weight:600;color:var(--text);font-variant-numeric:tabular-nums;}

.wfi{background:none;border:none;}
.wfm{width:24px;height:24px;border-radius:50%;background:#22d3ee;color:#04202b;font-family:'Outfit',sans-serif;font-weight:800;font-size:12px;line-height:1;
  display:flex;align-items:center;justify-content:center;box-shadow:0 0 0 4px rgba(34,211,238,.25),0 0 12px rgba(34,211,238,.6);}
.wfm.sm{width:17px;height:17px;font-size:9.5px;box-shadow:none;flex-shrink:0;}


/* ── header uniformizado (padrão IPVS) ─────────────────────────────── */
#hd h1, #header h1, #pd-header h1 {
  font-family:'Outfit',sans-serif; font-weight:700; font-size:14px; color:#fff;
  text-transform:uppercase; letter-spacing:.04em; white-space:nowrap; margin:0; line-height:1.2;
}
#hd h1 span, #header h1 span, #pd-header h1 span { color: var(--accent); }
#hd .sub, #header .sub, #pd-header .sub,
#hd .subtitle, #header .subtitle, #pd-header .subtitle {
  font-size:11px; color:rgba(255,255,255,.65); font-weight:300;
  white-space:nowrap; margin:0; line-height:1.3;
}
#hd .badge, #header .badge, #pd-header .badge,
#hd .header-badge, #header .header-badge, #pd-header .hbadge, #header .hbadge {
  font-family:'Outfit',sans-serif; font-size:10px; font-weight:700; color:var(--accent);
  border:1px solid rgba(255,239,0,.4); background:transparent;
  padding:3px 8px; border-radius:4px; white-space:nowrap; letter-spacing:.02em;
}

/* ── tipografia e cor: textos longos e valores numéricos ──────────────── */
/* Prosa explicativa em branco: popups, onboarding e notas de rodapé de
   painel. Cabeçalhos e apontamentos de legenda mantêm o azul claro. */
.pexp, .nota, .sel-vazio, .pc-note, #pnl-hint, .bar-sub-long {
  color: var(--text) !important;
}
/* Valores numéricos em legenda: cor fixa de alta legibilidade.
   A cor da categoria fica no quadradinho e na barra, nunca no número. */
.bar-lb .v, .rk .p, .li .cnt, .sel-v, .pt td, .pc-v {
  color: var(--text) !important;
  font-variant-numeric: tabular-nums;
}

/* ── mapa de postos: barras do perfil por atividade ── */
.seclist{margin-top:6px}
.secrow{margin-bottom:7px}
.secrow .t{display:flex;justify-content:space-between;gap:8px;font-size:11px;
  color:var(--text);line-height:1.25}
.secrow .t b{font-family:Outfit,sans-serif;font-weight:600;font-variant-numeric:tabular-nums}
.secrow .bar{height:5px;border-radius:3px;background:rgba(147,180,204,.16);margin-top:3px;
  overflow:hidden}
.secrow .bar i{display:block;height:100%;border-radius:3px;background:#93b4cc}
.kv{display:flex;justify-content:space-between;gap:10px;font-size:11.5px;
  color:var(--text);padding:3px 0}
.kv span:last-child{font-family:Outfit,sans-serif;font-weight:600;
  font-variant-numeric:tabular-nums}
.nota{font-size:10.5px;color:var(--muted);line-height:1.45;margin-top:8px}
/* ── grupos de atividade: chip clicável que isola o grupo no mapa ── */
.grp{display:flex;flex-wrap:wrap;gap:5px;margin-top:7px}
.gchip{display:inline-flex;align-items:center;gap:6px;cursor:pointer;
  font-family:Raleway,sans-serif;font-size:11px;color:var(--text);
  background:rgba(147,180,204,.10);border:1px solid rgba(147,180,204,.22);
  border-radius:999px;padding:4px 9px 4px 6px;line-height:1;
  transition:background .15s,border-color .15s}
.gchip:hover{background:rgba(147,180,204,.20)}
.gchip.on{background:rgba(255,239,0,.14);border-color:#FFEF00}
.gchip i{width:9px;height:9px;border-radius:50%;flex-shrink:0;
  box-shadow:0 0 0 1px rgba(13,27,42,.75)}
.gchip b{font-family:Outfit,sans-serif;font-weight:600;font-size:10.5px;
  color:var(--muted);font-variant-numeric:tabular-nums}
.gchip.on b{color:var(--text)}
/* círculos graduados sem número: só a progressão de tamanho */
.portes{display:flex;align-items:flex-end;gap:7px;margin:7px 0 4px;padding-left:2px}
.portes i{display:block;border-radius:50%;background:rgba(147,180,204,.55);
  box-shadow:0 0 0 1px rgba(13,27,42,.75);flex-shrink:0}
/* ── distribuição salarial do setor: barra empilhada das faixas de SM ── */
.dsal{margin-top:9px;padding-top:8px;border-top:1px solid rgba(147,180,204,.18)}
.dsal-k{font-family:Outfit,sans-serif;font-size:10px;letter-spacing:.06em;
  text-transform:uppercase;color:var(--muted);margin-bottom:5px}
.dsal-b{display:flex;height:9px;border-radius:3px;overflow:hidden;
  background:rgba(147,180,204,.14);gap:1px}
.dsal-b i{display:block;height:100%}
.dsal-l{display:flex;flex-wrap:wrap;gap:4px 10px;margin-top:5px;
  font-size:10.5px;color:var(--muted)}
</style>
</head>
<body>
<div id="pd-header">
  <div class="logo-dot"></div>
  <div><h1>Postos de <span>Trabalho</span></h1><p class="sub">Setor privado · Revisão do Plano Diretor · Bragança Paulista</p></div>
  <div class="sep"></div>
  <span class="hbadge">RAIS 2024 · Receita Federal · CNEFE</span>
  <a id="pd-back" href="../portal.html">&#8592; Portal</a>
  <button id="pd-export" onclick="abrirExport()">&#8595; Exportar</button>
  <button id="pd-panel" onclick="tog('sb')">&#9776; Painel</button>
  <button id="pd-legenda" onclick="tog('rb')">&#9636; Legenda</button>
</div>
<div id="map"></div>
<div id="sb" class="pane">
  <div class="pane-h"><span>Controles</span></div>
  <div class="pane-b">
    <div class="panel-section">
      <div class="ind" id="ind"></div>
      <div class="opr" style="padding-left:15px;margin-top:8px"><label>Opacidade</label>
        <input type="range" min="0" max="1" step=".05" value=".75" oninput="op(this.value);this.nextElementSibling.textContent=Math.round(this.value*100)+'%'"><span>75%</span></div>
    </div>
    <div class="panel-section">
      <span class="section-label">Camadas</span>
      <div class="ltr"><label for="k-est">Estabelecimentos empregadores</label>
        <label class="tg"><input type="checkbox" id="k-est" checked onchange="camadas()"><span class="trk"></span></label></div>
    </div>
    <div class="panel-section" style="border-bottom:none">
      <span class="section-label">Mapa base</span>
      <div class="bmr"><button class="bmb on" onclick="bm('dark',this)">Escuro</button><button class="bmb" onclick="bm('osm',this)">Mapa</button><button class="bmb" onclick="bm('sat',this)">Satélite</button></div>
    </div>
  </div>
</div>
<div id="rb" class="pane"><div class="pane-h"><span id="rb-t">Legenda e informações</span></div>
  <div class="pane-b"><div id="leitura"></div><div id="lg"></div></div></div>
<div id="md"><div id="mb"><div id="mt">&#8595; Exportar mapa</div>
  <p id="mdesc">O mapa é capturado como está na tela, com a legenda das camadas visíveis.</p>
  <div id="mbtn"><button class="eb" onclick="exportar('jpeg')">Imagem JPEG</button><button class="eb" onclick="exportar('pdf')">PDF</button></div>
  <div id="mst"></div><button id="mcl" onclick="fecharExport()">Cancelar</button></div></div>
<script src="data/json_setores.js"></script>
<script src="data/json_estab.js"></script>
<script src="data/json_limite.js"></script>
<script src="data/json_stats.js"></script>
<script>
var ST = json_stats;
function nb(v, d) {
  if (v === null || v === undefined || isNaN(v)) return '—';
  return Number(v).toLocaleString('pt-BR', {minimumFractionDigits: d || 0,
                                            maximumFractionDigits: d || 0});
}
function rs(v, d) { return v === null || v === undefined || isNaN(v) ? '—' : 'R$ ' + nb(v, d === undefined ? 2 : d); }

var IND = {
  pm: {lb: 'Postos por morador',
       sm: 'quantos postos de trabalho para cada morador do setor', k: 'pm',
       cl: [[0, .05, 'até 0,05'], [.05, .2, '0,05 a 0,20'], [.2, .5, '0,20 a 0,50'],
            [.5, 1, '0,50 a 1,00'], [1, 1e9, 'mais de 1,00']],
       co: ['#fde9a9', '#f9b46b', '#f0773f', '#d23c33', '#8f1d2c'], dec: 2,
       sem: 'Menos de 50 moradores'},
  ph: {lb: 'Densidade de postos',
       sm: 'postos por hectare urbanizado', k: 'ph',
       cl: [[0, 2, 'até 2'], [2, 8, '2 a 8'], [8, 20, '8 a 20'],
            [20, 60, '20 a 60'], [60, 1e9, 'mais de 60']],
       co: ['#ffffcc', '#c2e699', '#78c679', '#31a354', '#006837'], dec: 1,
       sem: 'Sem área urbanizada mapeada'},
  // mesma rampa e mesmas quebras em salários mínimos do Mapa 07 — Renda
  // Domiciliar, para que a mesma cor signifique o mesmo múltiplo do salário
  // mínimo nos dois mapas. O SM é o do ano de cada base: R$ 1.212 em 2022,
  // no Censo, e R$ 1.412 em 2024, na RAIS.
  rem: {lb: 'Remuneração do posto mediano',
        sm: 'quanto ganha o posto do meio, no setor', k: 'rem',
        cl: [[0, 2118, 'até 1,5 SM'], [2118, 2824, '1,5 a 2 SM'],
             [2824, 4236, '2 a 3 SM'], [4236, 7060, '3 a 5 SM'],
             [7060, 14120, '5 a 10 SM'], [14120, 1e9, 'acima de 10 SM']],
        co: ['#440154', '#3b528b', '#21918c', '#5ec962', '#bddf26', '#fde725'],
        dec: 0, sm_ref: 1412,
        sem: 'Sem posto de trabalho no setor'}
};

// ── grupos de atividade, para a cor dos estabelecimentos ───────────────────
// Paleta construída para este fundo escuro e validada em todos-contra-todos:
// pior par ΔE 15,5 em visão normal e 8,6 em deuteranopia (OKLab ×100).
// A cor sozinha não carrega a identidade: há filtro por grupo e o nome do
// grupo aparece no cursor.
var GRUPOS = [
  ['ind', 'Indústria', '#865dd7'],
  ['com', 'Comércio', '#e84da8'],
  ['ser', 'Serviços', '#009ee1'],
  ['con', 'Construção', '#b65e46'],
  ['sed', 'Saúde e educação', '#008d7a'],
  ['agr', 'Agropecuária', '#84a200']
];
var COR_GRUPO = {};
GRUPOS.forEach(function (g) { COR_GRUPO[g[0]] = g[2]; });
var NOME_GRUPO = {};
GRUPOS.forEach(function (g) { NOME_GRUPO[g[0]] = g[1]; });
var grupoAtivo = null;          // null = todos
var CONTA_GRUPO = {};
json_estab.features.forEach(function (f) {
  var g = f.properties.g;
  CONTA_GRUPO[g] = (CONTA_GRUPO[g] || 0) + 1;
});

// Isolar um grupo é a codificação secundária que a cor sozinha não dá: com
// seis matizes simultâneas sobre o coroplético, a identidade se recupera
// isolando o grupo, não discriminando o matiz.
function filtroGrupo(g) {
  grupoAtivo = (grupoAtivo === g) ? null : g;
  Lest.eachLayer(function (l) {
    var p = l.feature.properties;
    var vis = !grupoAtivo || p.g === grupoAtivo;
    l.setStyle({fillOpacity: vis ? (p.t >= 3 ? .95 : .8) : .05,
                opacity: vis ? .9 : .05});
  });
  Lset.setStyle(estSet);        // os três indicadores recalculam para o grupo
  if (_trava) { _trava = null; }
  document.getElementById('leitura').innerHTML = cardGeral();
  legenda();
}
var SETOR_POR_CD = {};
json_setores.features.forEach(function (f) { SETOR_POR_CD[f.properties.cd] = f; });
var atual = 'pm';

var map = L.map('map', {zoomControl: true, preferCanvas: true,
                        attributionControl: false}).setView([-22.95, -46.54], 12);
L.control.scale({imperial: false}).addTo(map);
// 'est' saiu: desde que setores e estabelecimentos passaram a dividir o mesmo
// canvas, o pane dos estabelecimentos ficou criado e nunca usado
['set', 'lim'].forEach(function (p, i) {
  map.createPane('p_' + p);
  map.getPane('p_' + p).style.zIndex = 400 + i * 10;
});
map.getPane('p_lim').style.pointerEvents = 'none';

var BM = {
  dark: 'https://server.arcgisonline.com/ArcGIS/rest/services/Canvas/World_Dark_Gray_Base/MapServer/tile/{z}/{y}/{x}',
  osm: 'https://server.arcgisonline.com/ArcGIS/rest/services/World_Street_Map/MapServer/tile/{z}/{y}/{x}',
  sat: 'https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}'
};
var ZMAX = {dark: 16, osm: 17, sat: 17};
var baseL = null;
function bm(k, el) {
  if (baseL) map.removeLayer(baseL);
  // crossOrigin e obrigatorio para o mapa base aparecer na exportacao: sem
  // ele o azulejo contamina o canvas e o drawImage e descartado
  baseL = L.tileLayer(BM[k], {maxNativeZoom: ZMAX[k], maxZoom: 19, pane: 'tilePane',
    crossOrigin: 'anonymous',
    referrerPolicy: 'strict-origin-when-cross-origin'}).addTo(map);
  if (el) { document.querySelectorAll('.bmb').forEach(function (b) { b.classList.remove('on'); }); el.classList.add('on'); }
}
bm('dark');

var OPAC = .75;
function rural(f) { return (f.properties.sit || '') === 'Rural'; }

// ── valor do indicador, respeitando o filtro de atividade da legenda
//
// Com um grupo selecionado o mapa passa a responder "onde está a indústria
// por morador", e não "onde está o emprego por morador, com a indústria
// destacada". Os três indicadores são recalculados só com os postos daquele
// grupo; as faixas de cor continuam as mesmas, para que o filtro ligado e
// desligado possam ser comparados.
function valorInd(p, k) {
  k = k || IND[atual].k;
  if (!grupoAtivo) { return p[k] === undefined ? null : p[k]; }
  var g = p.grp && p.grp[grupoAtivo];
  if (!g) { return null; }                       // nenhum posto desse grupo aqui
  if (k === 'rem') { return g[1]; }
  if (k === 'pm') { return p.mor >= 50 ? g[0] / p.mor : null; }
  if (k === 'ph') { return p.urb > 0 ? g[0] / p.urb : null; }
  return p[k];
}
function postosDe(p) {
  if (!grupoAtivo) { return p.pos; }
  var g = p.grp && p.grp[grupoAtivo];
  return g ? g[0] : 0;
}
function semdado(f) { var v = valorInd(f.properties); return v === null || v === undefined; }
function corDe(v) {
  var c = IND[atual];
  for (var i = 0; i < c.cl.length; i++) if (v >= c.cl[i][0] && v < c.cl[i][1]) return c.co[i];
  return c.co[c.co.length - 1];
}
function estSet(f) {
  if (rural(f)) return {color: '#93b4cc', weight: .5, opacity: .5, fillColor: '#93b4cc',
                        fillOpacity: OPAC * .25};
  if (semdado(f)) return {color: '#93b4cc', weight: .4, opacity: .45, fillColor: '#93b4cc',
                          fillOpacity: OPAC * .12, dashArray: '2,2'};
  return {color: '#0d1b2a', weight: .4, opacity: .55,
          fillColor: corDe(valorInd(f.properties)), fillOpacity: OPAC};
}
// UM canvas para setores e estabelecimentos. Com dois renderers empilhados, o
// canvas de cima recebe o mousemove e o de baixo nunca o vê: o hover do setor
// não disparava em lugar nenhum. No mesmo canvas, o Leaflet testa todas as
// feições e a última desenhada vence — o ponto ganha do polígono, que é o que
// se quer.
var rendSet = L.canvas({padding: .3, pane: 'p_set'});
var Lset = L.geoJSON(json_setores, {
  pane: 'p_set', renderer: rendSet, style: estSet,
  onEachFeature: function (f, l) {
    // O SETOR responde ao cursor e o ESTABELECIMENTO, ao clique. O setor é o
    // fundo contínuo do mapa: passar o cursor por ele é o gesto natural. O
    // ponto é alvo pequeno e disputado, e clicar nele é mais confiável do que
    // acertá-lo com o cursor parado.
    l.on('mouseover', function () { ler('setor', f, false); });
  }
}).addTo(map);

var Llim = L.geoJSON(json_limite, {pane: 'p_lim', interactive: false,
  style: {color: '#FFEF00', weight: 1.4, opacity: .9, fill: false}}).addTo(map);

// p.t e a CLASSE de tamanho (1 a 5). O número de postos não é publicado.
// O menor raio é 2,0: abaixo disso o halo claro cobria o preenchimento e o
// ponto perdia a cor do grupo.
var RAIO = {5: 8, 4: 5.8, 3: 3.6, 2: 2.6, 1: 2};
function raio(p) { return RAIO[p.t] || 2; }
var rendEst = rendSet;          // mesmo canvas, para o hover do setor funcionar
var Lest = L.geoJSON(json_estab, {
  pane: 'p_set',
  pointToLayer: function (f, ll) {
    // Halo CLARO, com espessura proporcional ao raio: separa o círculo de
    // qualquer preenchimento embaixo. O anel escuro que havia antes sumia
    // sobre o roxo do viridis e engolia os círculos menores.
    var r = raio(f.properties);
    return L.circleMarker(ll, {pane: 'p_set', renderer: rendEst, radius: r,
      color: '#eef2f7', weight: r >= 4 ? 1.1 : r >= 2.6 ? .8 : .5, opacity: r >= 2.6 ? .9 : .65,
      fillColor: COR_GRUPO[f.properties.g] || '#93b4cc',
      fillOpacity: f.properties.t >= 3 ? .95 : .8});
  },
  onEachFeature: function (f, l) {
    // o círculo cobre o setor: sem isto, passar o cursor por um ponto deixava
    // o painel parado, porque o mouseover do setor não chega a disparar
    l.on('mouseover', function () {
      var fs = SETOR_POR_CD[f.properties.cd];
      if (fs) { ler('setor', fs, false); }
    });
    l.on('click', function (e) {
      _camada = Date.now();           // avisa o handler do mapa para não soltar
      ler('estab', f, true);
      L.DomEvent.stop(e);
    });
  }
}).addTo(map);

map.fitBounds(Llim.getBounds(), {padding: [18, 18]});

function on(id) { var e = document.getElementById(id); return !e || e.checked; }
window.camadas = function () {
  if (on('k-est')) Lest.addTo(map); else map.removeLayer(Lest);
  legenda();
};

/* ─────────── painel de leitura: hover preenche, clique trava ─────────── */
var _trava = null;
function cardGeral() {
  var s = ST;
  // com filtro ligado o card do município passa a falar só do grupo escolhido
  if (grupoAtivo) {
    var tp = 0, te = 0;
    json_setores.features.forEach(function (f) {
      var g = f.properties.grp && f.properties.grp[grupoAtivo];
      if (g) { tp += g[0]; }
    });
    te = CONTA_GRUPO[grupoAtivo] || 0;
    return '<div class="lc geral"><div class="lc-k">' + NOME_GRUPO[grupoAtivo] +
      '</div><div class="lc-t">Bragança Paulista</div>' +
      '<div class="lc-n">' + nb(tp, 0) + '</div>' +
      '<div class="lc-u">Postos estimados em ' + nb(te) + ' estabelecimento' +
      (te === 1 ? '' : 's') + ' deste grupo.</div>' +
      '<div class="kv"><span>Parcela do emprego privado</span><span>' +
      nb(100 * tp / s.postos, 1) + '%</span></div>' +
      '<div class="kv"><span>Postos por morador</span><span>' +
      nb(tp / s.moradores, 2) + '</span></div>' +
      '</div>';
  }
  var h = '<div class="lc geral"><div class="lc-k">Postos formais no setor privado</div>' +
    '<div class="lc-t">Bragança Paulista</div>' +
    '<div class="lc-n">' + nb(s.postos) + '</div>' +
    '<div class="lc-u">Vínculos ativos em 31/12/2024, em ' + nb(s.estabelecimentos) +
    ' estabelecimentos empregadores.</div>' +
    '<div class="kv"><span>Postos por morador</span><span>' + nb(s.p_mor_municipio, 2) + '</span></div>' +
    '<div class="kv"><span>Remuneração média</span><span>' + rs(s.rem_media) + '</span></div>' +
    '<div class="kv"><span>Massa salarial mensal</span><span>' + rs(s.massa_mensal, 0) + '</span></div>' +
    '</div>';
  return h;
}
// Mostra COMO os salários do setor se distribuem. Um número só esconde o
// caso bimodal: no setor do Lago do Taboão, 33% dos postos ganham até 1,5 SM
// e 47% ganham mais de 10 SM, porque um clube de futebol divide o setor com
// bares e restaurantes. Nem média nem mediana descrevem esse setor sozinhas.
var FX_SM = ['até 1,5', '1,5 a 2', '2 a 3', '3 a 5', '5 a 10', 'mais de 10'];
function faixaSalarial(p) {
  if (!p.dist) { return ''; }
  var h = '<div class="dsal"><div class="dsal-k">Postos por faixa de salário mínimo</div>' +
    '<div class="dsal-b">';
  p.dist.forEach(function (v, i) {
    if (!v) { return; }
    h += '<i style="width:' + v + '%;background:' + IND.rem.co[i] +
      '" title="' + FX_SM[i] + ' SM: ' + v + '% dos postos"></i>';
  });
  h += '</div><div class="dsal-l">';
  p.dist.forEach(function (v, i) {
    if (v >= 12) { h += '<span>' + FX_SM[i] + ' SM: ' + v + '%</span>'; }
  });
  h += '</div>';
  if (p.dom !== null && p.dom >= .5) {
  }
  return h + '</div>';
}

function cardSetor(f) {
  var p = f.properties;
  var _pm = valorInd(p, 'pm'), _ph = valorInd(p, 'ph'), _rem = valorInd(p, 'rem');
  var h = '<div class="lc setor"><div class="lc-k">' +
    (grupoAtivo ? NOME_GRUPO[grupoAtivo] + ' no setor' : 'Postos estimados no setor') +
    '</div>' +
    '<div class="lc-t">' + (p.bairro || p.nuc || 'Setor censitário') + '</div>' +
    '<div class="lc-n">' + nb(postosDe(p), 0) + '</div>' +
    '<div class="lc-u">' + (grupoAtivo
      ? 'Postos deste grupo, de ' + nb(p.pos, 0) + ' no setor.'
      : 'Em ' + nb(p.est) + ' estabelecimento' + (p.est === 1 ? '' : 's') +
        ' empregador' + (p.est === 1 ? '' : 'es') + '.') + '</div>' +
    '<div class="kv"><span>Moradores</span><span>' + nb(p.mor) + '</span></div>' +
    '<div class="kv"><span>Postos por morador</span><span>' +
    (_pm === null ? '—' : nb(_pm, 2)) + '</span></div>' +
    '<div class="kv"><span>Postos por hectare urbanizado</span><span>' +
    (_ph === null ? '—' : nb(_ph, 1)) + '</span></div>' +
    '<div class="kv"><span>Posto mediano ganha</span><span>' + rs(_rem) + '</span></div>';
  if (!grupoAtivo) {
    h += '<div class="kv"><span>Remuneração média</span><span>' + rs(p.remm) + '</span></div>' +
      '<div class="kv"><span>Parcela dos postos do município</span><span>' +
      nb(p.pct, 2) + '%</span></div>';
    h += faixaSalarial(p);
  } else {
    h += '';
  }
  // o total do município é dado declarado da RAIS; a divisão entre setores é
  // soma de estimativas por estabelecimento, e o card precisa dizer isso
  if (p.sit === 'Rural') {
    h += '<div class="lc-e">Setor rural: fora da escala de cor.</div>';
  }
  return h + '</div>';
}
function cardEstab(f) {
  var p = f.properties;
  var NV = {1: 'endereço exato', 2: 'logradouro e número', 3: 'número mais próximo',
            4: 'nome do estabelecimento', 5: 'centroide do CEP', 6: 'sem localização'};
  // O número de postos e a remuneração de cada estabelecimento são ESTIMADOS
  // e não são publicados aqui: o tamanho do círculo já dá a leitura de porte,
  // sem afirmar um valor que a RAIS não informa por empresa.
  return '<div class="lc ubs"><div class="lc-k"><span class="pto" style="background:' +
    (COR_GRUPO[p.g] || '#93b4cc') + '"></span> Estabelecimento empregador</div>' +
    '<div class="lc-t">' + (NOME_GRUPO[p.g] || 'Atividade') + '</div>' +
    '<div class="lc-u">' + p.sec + '</div>' +
    '<div class="kv"><span>Classe CNAE</span><span>' + p.cnae + '</span></div>' +
    '<div class="kv"><span>Localização</span><span>' + (NV[p.nv] || '—') + '</span></div>' +
    '</div>';
}
function ler(t, f, travar) {
  if (_trava && !travar) return;
  if (travar) _trava = true;
  document.getElementById('leitura').innerHTML =
    t === 'setor' ? cardSetor(f) : t === 'estab' ? cardEstab(f) : cardGeral();
}
function solta() { _trava = null; document.getElementById('leitura').innerHTML = cardGeral(); }
// Com renderer de canvas o clique da camada nem sempre impede o clique do
// mapa, e a trava era desfeita no mesmo gesto que a criava. A bandeira é
// independente do renderer.
// Bandeira com HORA, não booleana: quando o L.DomEvent.stop já impede o
// clique do mapa, uma bandeira booleana nunca é consumida e engole o clique
// seguinte — a trava ficava impossível de soltar.
var _camada = 0;
map.on('click', function () {
  if (Date.now() - _camada < 120) { return; }
  solta();
});
map.on('mouseout', function () { if (!_trava) document.getElementById('leitura').innerHTML = cardGeral(); });

/* ─────────── legenda ─────────── */
function legenda() {
  var c = IND[atual], h = '';
  h += '<div class="lgh">' + c.lb + '</div><div class="lgs">' + c.sm + '</div>';
  var cont = {}, i;
  json_setores.features.forEach(function (f) {
    if (rural(f) || semdado(f)) return;
    var v = valorInd(f.properties);
    for (i = 0; i < c.cl.length; i++) if (v >= c.cl[i][0] && v < c.cl[i][1]) { cont[i] = (cont[i] || 0) + 1; break; }
  });
  c.cl.forEach(function (x, j) {
    h += '<div class="li"><div class="sw" style="background:' + c.co[j] + '"></div>' +
      '<span>' + x[2] + '</span><span class="cnt">' + nb(cont[j] || 0) + ' setores</span></div>';
  });
  h += '<div class="li"><div class="sw" style="background:#93b4cc;opacity:.3;border-style:dashed"></div>' +
    '<span>' + (c.sem || 'Sem dado') + '</span></div>';
  h += '<div class="li"><div class="sw" style="background:#93b4cc;opacity:.45"></div>' +
    '<span>Setor rural</span></div>';

  if (on('k-est')) {
    h += '<div class="lgh" style="margin-top:14px">Estabelecimentos por atividade</div>';
    h += '<div class="grp">';
    GRUPOS.forEach(function (g) {
      var q = CONTA_GRUPO[g[0]] || 0;
      if (!q) { return; }
      var sel = grupoAtivo === g[0];
      h += '<button class="gchip' + (sel ? ' on' : '') + '" onclick="filtroGrupo(\'' +
        g[0] + '\')" title="Clique para isolar este grupo no mapa">' +
        '<i style="background:' + g[2] + '"></i>' + g[1] +
        '<b>' + nb(q) + '</b></button>';
    });
    h += '</div>';
    // círculos graduados SEM número: o valor por estabelecimento é estimado
    h += '<div class="lgh" style="margin-top:12px">Porte do estabelecimento</div>';
    h += '<div class="portes">';
    [RAIO[1], RAIO[2], RAIO[3], RAIO[4], RAIO[5]].forEach(function (r) {
      h += '<i style="width:' + (r * 1.6) + 'px;height:' + (r * 1.6) + 'px"></i>';
    });
    h += '</div>';
  }

  h += '<div class="lgh" style="margin-top:14px">Postos por atividade</div><div class="seclist">';
  var mx = ST.secoes[0].postos;
  ST.secoes.slice(0, 9).forEach(function (s) {
    // a barra usa a cor do grupo, amarrando este perfil aos chips e ao mapa
    h += '<div class="secrow"><div class="t"><span>' + s.nome + '</span><b>' + nb(s.postos) +
      '</b></div><div class="bar"><i style="width:' + (100 * s.postos / mx) +
      '%;background:' + (COR_GRUPO[s.g] || '#93b4cc') + '"></i></div></div>';
  });
  h += '</div>';
  document.getElementById('lg').innerHTML = h;
}

/* ─────────── indicadores ─────────── */
function montaInd() {
  var h = '';
  Object.keys(IND).forEach(function (k) {
    var c = IND[k];
    // sem sub-rotulo de grupo: com apenas tres indicadores, os cabecalhos de
    // grupo so empurravam os botoes para baixo
    h += '<button class="' + (k === atual ? 'on' : '') + '" onclick="ind(\'' + k + '\')">' +
      c.lb + '<small>' + c.sm + '</small></button>';
  });
  document.getElementById('ind').innerHTML = h;
}
window.ind = function (k) {
  atual = k;
  Lset.setStyle(estSet);
  montaInd();
  legenda();
};
window.op = function (v) { OPAC = parseFloat(v); Lset.setStyle(estSet); };

/* ─────────── cabeçalho: painéis e exportação ───────────
   Estes quatro handlers estavam sendo CHAMADOS pelo markup do cabeçalho e
   nunca foram definidos nesta página: os botões Painel, Legenda e Exportar
   não faziam nada desde a primeira versão. A extração automática planejada
   (GENERICAS) nunca chegou a ser implementada, e a lista procurava
   "function tog(" enquanto o original declara "window.tog = function". */
window.tog = function (id) { document.getElementById(id).classList.toggle('hidden'); };
window.abrirExport = function () {
  document.getElementById('mst').textContent = '';
  document.getElementById('md').classList.add('open');
};
window.fecharExport = function () { document.getElementById('md').classList.remove('open'); };

function rr(c, x, y, w, h, r) {
  c.beginPath(); c.moveTo(x + r, y); c.lineTo(x + w - r, y);
  c.quadraticCurveTo(x + w, y, x + w, y + r); c.lineTo(x + w, y + h - r);
  c.quadraticCurveTo(x + w, y + h, x + w - r, y + h); c.lineTo(x + r, y + h);
  c.quadraticCurveTo(x, y + h, x, y + h - r); c.lineTo(x, y + r);
  c.quadraticCurveTo(x, y, x + r, y); c.closePath();
}
function nrt(c, cx, cy, s) {
  c.save(); c.fillStyle = '#fff'; c.strokeStyle = '#000'; c.lineWidth = .5;
  c.beginPath(); c.moveTo(cx, cy - s); c.lineTo(cx + s * .4, cy + s * .2);
  c.lineTo(cx, cy + s * .05); c.closePath(); c.fill(); c.stroke();
  c.fillStyle = '#666'; c.beginPath(); c.moveTo(cx, cy - s);
  c.lineTo(cx - s * .4, cy + s * .2); c.lineTo(cx, cy + s * .05);
  c.closePath(); c.fill(); c.stroke();
  c.fillStyle = '#fff'; c.font = 'bold 10px Arial'; c.textAlign = 'center';
  c.fillText('N', cx, cy - s - 6); c.restore();
}
function dl(d, n) {
  var a = document.createElement('a'); a.href = d; a.download = n;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
}

window.exportar = function (fmt) {
  var st = document.getElementById('mst');
  st.textContent = 'Capturando…';
  var el = document.getElementById('map'), W = el.offsetWidth, H = el.offsetHeight;
  var mr = el.getBoundingClientRect();
  var cv = document.createElement('canvas'); cv.width = W; cv.height = H;
  var c = cv.getContext('2d');
  c.fillStyle = '#0d1b2a'; c.fillRect(0, 0, W, H);
  // azulejos do mapa base
  map.eachLayer(function (l) {
    if (!l._tiles) { return; }
    Object.keys(l._tiles).forEach(function (k) {
      var im = l._tiles[k].el;
      if (!im || im.tagName !== 'IMG' || !im.complete) { return; }
      var r = im.getBoundingClientRect();
      try {
        c.drawImage(im, Math.round(r.left - mr.left), Math.round(r.top - mr.top),
                    Math.round(r.width) || 256, Math.round(r.height) || 256);
      } catch (e) { /* azulejo de outra origem: ignora */ }
    });
  });
  setTimeout(function () {
    function pt(co) {
      var q = map.latLngToContainerPoint(L.latLng(co[1], co[0])); return [q.x, q.y];
    }
    function aneis(g) {
      return g.type === 'Polygon' ? [g.coordinates]
        : g.type === 'MultiPolygon' ? g.coordinates : [];
    }
    function pol(gl, sf) {
      if (!map.hasLayer(gl)) { return; }
      gl.eachLayer(function (l) {
        if (!l.feature || !l.feature.geometry) { return; }
        var s = sf(l.feature);
        aneis(l.feature.geometry).forEach(function (poly) {
          c.beginPath();
          poly.forEach(function (ring) {
            ring.forEach(function (co, i) {
              var q = pt(co); if (i) { c.lineTo(q[0], q[1]); } else { c.moveTo(q[0], q[1]); }
            });
            c.closePath();
          });
          if (s.fill !== false && s.fillOpacity > 0) {
            c.globalAlpha = s.fillOpacity; c.fillStyle = s.fillColor; c.fill('evenodd');
          }
          if (s.stroke !== false && s.weight > 0 && s.opacity > 0) {
            c.globalAlpha = s.opacity; c.strokeStyle = s.color; c.lineWidth = s.weight;
            c.setLineDash(s.dashArray ? s.dashArray.split(',').map(Number) : []);
            c.stroke(); c.setLineDash([]);
          }
        });
        c.globalAlpha = 1;
      });
    }
    pol(Lset, estSet);
    // o limite e desenhado direto: iterar Llim devolve poligonos, nao grupos,
    // e pol() espera um grupo
    pol(Llim, function () {
      return {color: '#FFEF00', weight: 1.4, opacity: .9, fill: false};
    });
    // estabelecimentos, respeitando o filtro de atividade
    if (map.hasLayer(Lest)) {
      Lest.eachLayer(function (l) {
        var p = l.feature.properties;
        if (grupoAtivo && p.g !== grupoAtivo) { return; }
        var q = pt([l.getLatLng().lng, l.getLatLng().lat]), r = raio(p);
        c.beginPath(); c.arc(q[0], q[1], r, 0, 7);
        c.globalAlpha = p.t >= 3 ? .95 : .8;
        c.fillStyle = COR_GRUPO[p.g] || '#93b4cc'; c.fill();
        c.globalAlpha = .9; c.strokeStyle = '#eef2f7';
        c.lineWidth = r >= 4 ? 1.1 : r >= 2.6 ? .8 : .5; c.stroke();
        c.globalAlpha = 1;
      });
    }
    // tarja de título
    var I = IND[atual], P = 14;
    var t1 = 'Postos de Trabalho e Remuneração · setor privado · Bragança Paulista';
    var t2 = 'Mapa 23 · ' + I.lb + (grupoAtivo ? ' · ' + NOME_GRUPO[grupoAtivo] : '');
    c.font = 'bold 13px Arial'; var w1 = c.measureText(t1).width;
    c.font = '10px Arial';
    var tW = Math.max(w1, c.measureText(t2).width) + P * 2 + 4, tH = 44;
    c.fillStyle = 'rgba(1,117,188,.96)'; rr(c, P, P, tW, tH, 8); c.fill();
    c.fillStyle = '#FFEF00'; c.fillRect(P, P + tH - 3, tW, 3);
    c.fillStyle = '#fff'; c.font = 'bold 13px Arial'; c.textAlign = 'left';
    c.fillText(t1, P * 2, P + 19);
    c.fillStyle = '#FFEF00'; c.font = '10px Arial'; c.fillText(t2, P * 2, P + 34);
    nrt(c, W - 44, 56, 18);
    // legenda: faixas do indicador e grupos de atividade
    var its = [];
    I.cl.forEach(function (x, j) { its.push(['c', x[2], I.co[j]]); });
    its.push(['c', I.sem || 'Sem dado', '#93b4cc']);
    its.push(['c', 'Setor rural', '#93b4cc']);
    if (map.hasLayer(Lest)) {
      its.push(['h', 'ESTABELECIMENTOS']);
      GRUPOS.forEach(function (g) {
        if (!grupoAtivo || grupoAtivo === g[0]) {
          if (CONTA_GRUPO[g[0]]) { its.push(['c', g[1], g[2]]); }
        }
      });
    }
    c.font = '11px Arial';
    var lw = 0;
    its.forEach(function (i) { lw = Math.max(lw, c.measureText(i[1]).width); });
    lw += 46;
    var lh = its.length * 17 + 16, lx = P, ly = H - lh - P;
    c.fillStyle = 'rgba(13,27,42,.92)'; rr(c, lx, ly, lw, lh, 8); c.fill();
    c.strokeStyle = 'rgba(147,180,204,.35)'; c.lineWidth = 1; c.stroke();
    var yy = ly + 20;
    its.forEach(function (i) {
      if (i[0] === 'h') {
        c.fillStyle = '#93b4cc'; c.font = 'bold 9px Arial';
        c.fillText(i[1], lx + 12, yy);
      } else {
        c.fillStyle = i[2]; c.fillRect(lx + 12, yy - 8, 11, 11);
        c.fillStyle = '#e8eaf0'; c.font = '11px Arial';
        c.fillText(i[1], lx + 30, yy);
      }
      yy += 17;
    });
    c.fillStyle = '#93b4cc'; c.font = '9px Arial';
    c.fillText('RAIS 2024 · Receita Federal · CNEFE 2022', P, H - 4);

    var nome = 'mapa23-postos-trabalho-' + atual + (grupoAtivo ? '-' + grupoAtivo : '');
    if (fmt === 'pdf') {
      try {
        var jsPDF = (window.jspdf || {}).jsPDF;
        var doc = new jsPDF({orientation: W >= H ? 'l' : 'p', unit: 'px', format: [W, H]});
        doc.addImage(cv.toDataURL('image/jpeg', .92), 'JPEG', 0, 0, W, H);
        doc.save(nome + '.pdf');
      } catch (e) {
        st.textContent = 'Não foi possível gerar o PDF: ' + e.message;
        return;
      }
    } else {
      dl(cv.toDataURL('image/jpeg', .92), nome + '.jpg');
    }
    st.textContent = 'Pronto.';
    setTimeout(window.fecharExport, 700);
  }, 220);
};

montaInd();
legenda();
solta();
</script>
</body>
</html>
